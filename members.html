<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Group members</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
main{max-width:900px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.card img,.ph{width:96px;height:96px;border-radius:50%;object-fit:cover;margin:0 auto 10px;display:block}
.ph{background:var(--line);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;color:var(--mute)}
.card b{display:block}.card span{color:var(--mute);font-size:.9rem}
#s{margin-bottom:16px}a{color:var(--acc)}
</style>
</head>
<body>
<main>
<h1>Meet the group</h1>
<p class="sub">Who we are and what we do. <a href="/">Add yourself</a></p>
<input id="s" type="search" placeholder="Search by name or what they do" aria-label="Search members">
<div id="c" class="cards"></div>
<p id="e" class="sub"></p>
</main>
<script>
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let all=[];
function show(){
  const t=document.getElementById("s").value.toLowerCase();
  const rows=all.filter(m=>(m.name+" "+(m.occupation||"")).toLowerCase().includes(t));
  document.getElementById("c").innerHTML=rows.map(m=>`<div class="card">${m.photo_url?`<img src="${esc(m.photo_url)}" alt="${esc(m.name)}" loading="lazy">`:`<div class="ph" aria-hidden="true">${esc(m.name.trim()[0]||"?").toUpperCase()}</div>`}<b>${esc(m.name)}</b><span>${esc(m.occupation)}</span></div>`).join("");
  document.getElementById("e").textContent=rows.length?"":(all.length?"No one matches your search.":"No profiles yet. Be the first to add yours!");
}
document.getElementById("s").oninput=show;
fetch("/api/members").then(r=>r.json()).then(r=>{all=Array.isArray(r)?r:[];show()}).catch(()=>{document.getElementById("e").textContent="Could not load members. Refresh to try again."});
</script>
</body>
</html>
